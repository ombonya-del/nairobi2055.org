name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push cancels an older in-flight run.
# This is what prevents the "Queued" traffic jams that stalled the classic pipeline.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .        # static site lives at the repo root (index.html, sw.js, CNAME, assets)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
